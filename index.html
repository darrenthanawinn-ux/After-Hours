<head>

<title>After Hours — The Hallway Bell</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#040406;overflow:hidden;font-family:"Courier New",Courier,monospace;font-weight:bold;color:#e8e2cc;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc(100vh * 5 / 3));aspect-ratio:5/3;background:#000;--u:4px;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}

#toast{position:absolute;top:calc(var(--u)*6);left:50%;transform:translateX(-50%);font-size:calc(var(--u)*5.5);background:#0b0a10ee;border:calc(var(--u)*1) solid #8a7a50;padding:calc(var(--u)*2) calc(var(--u)*5);opacity:0;transition:opacity .4s;white-space:nowrap;color:#f0d890}
#hint{position:absolute;left:50%;bottom:calc(var(--u)*8);transform:translateX(-50%);font-size:calc(var(--u)*5.5);background:#0b0a10cc;border:calc(var(--u)*1) solid #5a5238;padding:calc(var(--u)*1.5) calc(var(--u)*5);color:#d8d0a8;display:none;white-space:nowrap}
#dlg{position:absolute;left:calc(var(--u)*8);right:calc(var(--u)*8);bottom:calc(var(--u)*6);min-height:calc(var(--u)*44);padding:calc(var(--u)*6) calc(var(--u)*8) calc(var(--u)*7);background:#0b0a10f2;border:calc(var(--u)*1.5) solid #d8d0b0;box-shadow:0 0 0 calc(var(--u)*1.5) #000,inset 0 0 0 calc(var(--u)*1) #2a2634}
#who{font-size:calc(var(--u)*5);color:#e0a060;letter-spacing:.12em;margin-bottom:calc(var(--u)*2);text-transform:uppercase}
#txt{font-size:calc(var(--u)*6.4);line-height:1.38;white-space:pre-wrap;color:#ece6d0;min-height:calc(var(--u)*26)}
#more{position:absolute;right:calc(var(--u)*6);bottom:calc(var(--u)*3);font-size:calc(var(--u)*5);color:#d8d0b0;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#dlg.plain{left:calc(var(--u)*24);right:calc(var(--u)*24);bottom:auto;top:50%;transform:translateY(-50%);background:transparent;border:none;box-shadow:none;text-align:center}
#dlg.plain #txt{font-size:calc(var(--u)*7.5);color:#d8d0b8}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.62);text-align:center}
#title h1{font-size:calc(var(--u)*22);letter-spacing:.14em;color:#d8d0b0;text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #5a1010,calc(var(--u)*-1) 0 0 #1b3a4a}
#title h2{font-size:calc(var(--u)*8);letter-spacing:.5em;color:#b04030;margin:calc(var(--u)*2) 0 calc(var(--u)*12)}
#title p{font-size:calc(var(--u)*5);color:#a89f84;line-height:1.7}
#title .go{margin-top:calc(var(--u)*9);font-size:calc(var(--u)*6.5);color:#f0e8c8;animation:bl 1.1s steps(2) infinite}
.panel{position:absolute;background:#0b0a10f4;border:calc(var(--u)*1.5) solid #d8d0b0;box-shadow:0 0 0 calc(var(--u)*1.5) #000}
#menu{left:calc(var(--u)*12);right:calc(var(--u)*12);top:calc(var(--u)*10);bottom:calc(var(--u)*10);padding:calc(var(--u)*5);display:flex;flex-direction:column}
#menuTabs{display:flex;gap:calc(var(--u)*8);font-size:calc(var(--u)*6);color:#776f58;margin-bottom:calc(var(--u)*4)}
#menuTabs .on{color:#f0d890;border-bottom:calc(var(--u)*1) solid #f0d890}
#menuBody{flex:1;display:flex;gap:calc(var(--u)*6);min-height:0}
#menuList{width:34%;overflow:hidden;font-size:calc(var(--u)*5.4);line-height:1.5}
#menuList div{padding:0 calc(var(--u)*2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9a927a}
#menuList div.sel{background:#d8d0b0;color:#0b0a10}
#menuDesc{flex:1;font-size:calc(var(--u)*5.6);line-height:1.4;white-space:pre-wrap;border-left:calc(var(--u)*1) solid #3a3626;padding-left:calc(var(--u)*5);overflow:hidden;color:#e4dcc2}
#menuFoot{margin-top:calc(var(--u)*4);font-size:calc(var(--u)*4.6);color:#b09a60;border-top:calc(var(--u)*1) solid #3a3626;padding-top:calc(var(--u)*3);line-height:1.4}
#code{left:50%;top:50%;transform:translate(-50%,-50%);padding:calc(var(--u)*7) calc(var(--u)*12);text-align:center;min-width:calc(var(--u)*130)}
#codeTitle{font-size:calc(var(--u)*6);color:#e0a060;margin-bottom:calc(var(--u)*5)}
#codeBoxes{display:flex;gap:calc(var(--u)*4);justify-content:center}
.cb{width:calc(var(--u)*15);height:calc(var(--u)*20);border:calc(var(--u)*1.5) solid #8a8470;background:#14121a;font-size:calc(var(--u)*13);line-height:calc(var(--u)*20);color:#f0d890}
#codeHint{font-size:calc(var(--u)*4.6);color:#8a8470;margin-top:calc(var(--u)*5)}
#choice{left:50%;top:50%;transform:translate(-50%,-50%);padding:calc(var(--u)*7) calc(var(--u)*10);min-width:calc(var(--u)*190)}
#choiceTitle{font-size:calc(var(--u)*5.6);color:#e0a060;margin-bottom:calc(var(--u)*5);line-height:1.4}
#choiceList div{font-size:calc(var(--u)*6.4);padding:calc(var(--u)*1.5) calc(var(--u)*4);color:#b8b098}
#choiceList div.sel{background:#d8d0b0;color:#0b0a10}
#choiceList div.off{color:#5a5646;text-decoration:line-through}
#endcard{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(var(--u)*20)}
#endcard h1{font-size:calc(var(--u)*20);letter-spacing:.2em;color:#d8d0b0;margin-bottom:calc(var(--u)*8)}
#endcard p{font-size:calc(var(--u)*5.6);color:#a89f84;line-height:1.7;white-space:pre-wrap}
#endcard .go{margin-top:calc(var(--u)*10);color:#f0e8c8;animation:bl 1.1s steps(2) infinite}
</style>

<body>
<div id="stage">
  <canvas id="c" width="320" height="192"></canvas>
  <div id="ui">
    <div id="fade"></div>
    <div id="flash"></div>
    <div id="toast"></div>
    <div id="hint"></div>
    <div id="dlg" class="hidden"><div id="who"></div><div id="txt"></div><div id="more">&#9660;</div></div>
    <div id="menu" class="panel hidden">
      <div id="menuTabs"><span id="tabItems">ITEMS</span><span id="tabNotes">NOTES</span></div>
      <div id="menuBody"><div id="menuList"></div><div id="menuDesc"></div></div>
      <div id="menuFoot"></div>
    </div>
    <div id="code" class="panel hidden"><div id="codeTitle"></div><div id="codeBoxes"></div><div id="codeHint"></div></div>
    <div id="choice" class="panel hidden"><div id="choiceTitle"></div><div id="choiceList"></div></div>
    <div id="title">
      <h1>AFTER HOURS</h1>
      <h2>THE HALLWAY BELL</h2>
      <p>MOVE: WASD / ARROWS &nbsp;&nbsp; INTERACT: E / SPACE<br>FLASHLIGHT: F &nbsp;&nbsp; MENU (ITEMS &amp; NOTES): ESC / I &nbsp;&nbsp; MUTE: M</p>
      <p class="go">- PRESS ANY KEY -</p>
      <p style="margin-top:calc(var(--u)*6);font-size:calc(var(--u)*4)">Best played in the dark, with headphones.</p>
    </div>
    <div id="endcard" class="hidden"><h1 id="endTitle"></h1><p id="endText"></p><p class="go">PRESS R TO PLAY AGAIN</p></div>
  </div>
</div>

<script>
(function(){
'use strict';
/* ================= CORE ================= */
const T=16,VW=320,VH=192;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const lc=document.createElement('canvas');lc.width=VW;lc.height=VH;
const lx=lc.getContext('2d');
const stage=$('stage');
function resize(){stage.style.setProperty('--u',(stage.clientWidth/VW)+'px');}
addEventListener('resize',resize);resize();

const DIR={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
let mode='title';
const G={};
let dlg=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=a=>a[Math.floor(Math.random()*a.length)];

function newGame(){
  Object.keys(G).forEach(k=>delete G[k]);
  Object.assign(G,{
    room:'hall',flags:{},items:[],notes:[],caught:0,t:0,clock:0,seq:[],
    player:{x:44,y:76,dir:'right',moving:false,anim:0,stepT:0,cp:[44,76]},
    mon:null,monTimer:0,fl:false,shake:0,timers:[],ambT:25,beatT:0,lastMsg:0,deskIdx:0,lockIdx:0
  });
}
newGame();

/* ================= AUDIO ================= */
let A=null,master=null,nbuf=null,ambG=null,ambF=null,muted=false;
function initAudio(){
  if(A)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  try{A=new AC();}catch(e){A=null;return;}
  master=A.createGain();master.gain.value=.55;master.connect(A.destination);
  const len=A.sampleRate*2;nbuf=A.createBuffer(1,len,A.sampleRate);
  const d=nbuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  startAmb();
}
function startAmb(){
  const o1=A.createOscillator(),o2=A.createOscillator();
  o1.type='sawtooth';o2.type='sawtooth';o1.frequency.value=48;o2.frequency.value=48.8;
  ambF=A.createBiquadFilter();ambF.type='lowpass';ambF.frequency.value=150;
  ambG=A.createGain();ambG.gain.value=.05;
  o1.connect(ambF);o2.connect(ambF);ambF.connect(ambG);ambG.connect(master);
  o1.start();o2.start();
  const ns=A.createBufferSource();ns.buffer=nbuf;ns.loop=true;
  const nf=A.createBiquadFilter();nf.type='bandpass';nf.frequency.value=900;nf.Q.value=.6;
  const ng=A.createGain();ng.gain.value=.011;
  ns.connect(nf);nf.connect(ng);ng.connect(master);ns.start();
}
function setAmb(g,f){if(!A)return;const t=A.currentTime;ambG.gain.linearRampToValueAtTime(g,t+1.5);ambF.frequency.linearRampToValueAtTime(f,t+1.5);}
function osc(type,f,t0,dur,vol,f2){
  if(!A)return;const o=A.createOscillator(),g=A.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.05);
}
function noise(dur,vol,type,freq,q,t0){
  if(!A)return;const s=A.createBufferSource();s.buffer=nbuf;s.loop=true;
  const f=A.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q||1;
  const g=A.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+dur+.05);
}
const now=()=>A?A.currentTime:0;
const sfx={
  step(){if(!A)return;const t=now();noise(.07,.1,'lowpass',380+Math.random()*140,1,t);osc('sine',90,t,.06,.05,60);},
  blip(){if(!A)return;osc('square',520+Math.random()*40,now(),.03,.02);},
  pick(){if(!A)return;const t=now();[523,659,784].forEach((f,i)=>osc('triangle',f,t+i*.08,.2,.08));},
  door(){if(!A)return;const t=now();noise(.35,.14,'lowpass',500,1,t);osc('sawtooth',120,t,.5,.04,70);},
  unlock(){if(!A)return;const t=now();osc('square',900,t,.05,.05);osc('square',600,t+.08,.06,.05);noise(.08,.1,'highpass',3000,1,t);},
  click(){if(!A)return;const t=now();noise(.04,.12,'highpass',2500,1,t);},
  locker(){if(!A)return;const t=now();noise(.25,.2,'bandpass',900,.8,t);osc('triangle',170,t,.3,.1,90);},
  slam(){if(!A)return;const t=now();noise(.4,.35,'lowpass',700,1,t);osc('sine',70,t,.4,.3,40);},
  bell(){if(!A)return;const t=now();[[1,.5],[2,.3],[2.4,.25],[3,.18],[4.2,.1],[5.4,.06]].forEach(p=>osc('sine',174.6*p[0],t,5.5,p[1]*.5));},
  stinger(){if(!A)return;const t=now();[220,233,311,330].forEach(f=>osc('sawtooth',f,t,1.4,.05,f*.96));noise(.6,.18,'highpass',2000,1,t);},
  heart(){if(!A)return;const t=now();osc('sine',60,t,.18,.28,40);osc('sine',55,t+.17,.18,.22,38);},
  whisper(){if(!A)return;const t=now();noise(1.3,.05,'bandpass',2600,3,t);noise(1.0,.04,'bandpass',1800,4,t+.3);},
  creak(){if(!A)return;osc('sawtooth',90,now(),.9,.03,150);},
  hiss(){if(!A)return;noise(1.1,.12,'highpass',2500,1,now());},
  clank(){if(!A)return;const t=now();osc('square',140,t,.15,.1,80);noise(.2,.18,'bandpass',1500,2,t);},
  flick(){if(!A)return;const t=now();noise(.03,.2,'highpass',4000,1,t);noise(.5,.06,'bandpass',900,1,t+.08);},
  gate(){if(!A)return;const t=now();noise(1.8,.18,'lowpass',300,1,t);osc('sawtooth',50,t,1.8,.1,35);},
  steps(n){if(!A)return;const t=now();for(let i=0;i<n;i++){noise(.07,.09,'lowpass',400,1,t+i*.27);}},
  tape(d){if(!A)return;const t=now();noise(d,.06,'bandpass',3500,.5,t);
    const o=A.createOscillator(),f=A.createBiquadFilter(),g=A.createGain();
    o.type='sawtooth';f.type='bandpass';f.Q.value=4;o.connect(f);f.connect(g);g.connect(master);
    g.gain.setValueAtTime(.0001,t);
    for(let s=0;s<d;s+=.16){o.frequency.setValueAtTime(95+Math.random()*35,t+s);f.frequency.setValueAtTime(400+Math.random()*1200,t+s);g.gain.setValueAtTime(Math.random()<.2?.0001:.07,t+s);}
    g.gain.setValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.1);}
};

/* ================= DATA ================= */
const ITEMS={
  flashlight:{name:"Flashlight",desc:"A heavy steel flashlight from Ms. Vance's desk.\n\nPress F to switch it on or off.\n\nThe beam seems to hold certain things still."},
  notebook:{name:"Science Notebook",desc:"Your science notebook. Test tomorrow. You'd give anything to be worried about that.\n\nOne page isn't yours."},
  musicKey:{name:"Music Room Key",desc:"A brass key taped to an index card.\n\n\"MUSIC ROOM. The tape is the key. -V\""},
  tape:{name:"Cassette Tape",desc:"A plain cassette in a cracked case.\n\nFACULTY MTG 11/3/86 - DO NOT PLAY."},
  rustyKey:{name:"Rusty Key",desc:"A rusty key on a faded ribbon. Fits an old, heavy lock."},
  basementKey:{name:"Basement Key",desc:"A heavy iron key. The tag reads BASEMENT / STAFF ONLY."},
  lighter:{name:"Brass Lighter",desc:"Engraved W.P. Still has fuel. Still warm, somehow."}
};
const NOTES={
  n_clock:{title:"The Stopped Clock",text:"The clock above the whiteboard is stopped at 4:47. The second hand trembles in place, like it's still trying."},
  n_roll:{title:"Roll Sheet, Room 2B",text:"ROLL - THURSDAY\nEnrolled: 1   Present: 1\n\nHALE, ROBIN ... PRESENT (4:47)\n\nThe ink is still wet. Your watch says 4:38."},
  n_board:{title:"Whiteboard",text:"In block capitals, over the ghosts of older messages:\n\nNO ONE IS DISMISSED UNTIL ROLL. -A.C.\n\nUnderneath, in small cursive: please don't be here when it rings. -V"},
  n_poster:{title:"Attendance Poster",text:"PERFECT ATTENDANCE = A PERFECT SCHOOL.\nHarlan Ridge: 100% for 15 years running, thanks to our Evening Program!\n\nIn the corner, a smiley face with too many teeth."},
  n_handbook:{title:"Student Handbook 9.4",text:"Students who remain on campus after the final bell are considered 'enrolled for the evening.' Parents will not be notified.\n\nEnrolled students are counted at roll. Counted students are not absent."},
  n_desk9:{title:"Carving, Desk 9",text:"Carved deep into the wood:\n\nIT KEEPS COUNT.\nIT NEVER LOSES COUNT."},
  n_page:{title:"The Page You Didn't Write",text:"A page in your handwriting. Your pen. Your name at the bottom.\n\n\"Don't go down. I already did. I'm still down there. The ledger has our name on every page. -R.\""},
  n_locker7:{title:"Locker 7",text:"Gum, a school photo of a grinning kid, and scratches inside the door:\n\nI STAYED FOR THE EVENING PROGRAM. I'M STILL HERE. TELL MY MOM I'M FINE."},
  n_trophy:{title:"Trophy Case",text:"PERFECT ATTENDANCE - 15 YEARS RUNNING.\n\nThe newest plaque is blank. Engraver's shavings still glitter on the glass."},
  n_plaque:{title:"Memorial Plaque",text:"THE EVENING PROGRAM - Est. 1984\n\"Every student counted.\" -Principal Alder Crane\n\nBeneath it, a column of names has been filed off and re-engraved so many times the brass has gone thin."},
  n_bulletin:{title:"Bulletin Board",text:"EVENING PROGRAM TONIGHT - ROOM 2B. Snack provided. Attendance mandatory. See roll.\n\nA hand-drawn arrow points toward the basement stairs. Someone has crossed out 'Snack provided.'"},
  n_tape:{title:"Tape: Faculty Meeting",text:"Principal Crane, Nov 3, 1986:\n\nThe Bell rings itself at 4:47. We did not hang it. Whoever remains at roll is counted, and counted children do not leave. Our attendance never falls.\n\nMr. Pell keeps the ledger, below. The office safe is set to the year the Program began. Ms. Vance, put the spare key where you put the hymn books. Inside the piano.\n\nRemain seated until roll."},
  n_hymn:{title:"Roll Call Hymn",text:"Hand-copied sheet music. Beneath the staves:\n\n\"Every name, every name, every name in the book -\nPresent, present, present, we'll be here when you look.\"\n\nScrawled across the top: STOP SINGING IT."},
  n_sched:{title:"Evening Program Schedule",text:"4:47 ROLL\n4:48 DOORS\n4:49 QUIET\n\nLedger kept below. Mr. Pell is not to leave the boiler room after roll.\nAttendance goal: 100%."},
  n_vance:{title:"Staff File: Vance, Ellen",text:"Student, class of '88. Remained after hours 10/1987. Counted. Appointed teacher's aide 1993; teacher 1996. Has never left the building. Attendance: perfect.\n\nMargin note: She still tries to warn them. Reprimand pending."},
  n_pell:{title:"Staff File: Pell, Walter",text:"Custodian since 1971. Insists the basement 'breathes.' Requested transfer nine times. Denied. Keeper of the Ledger by arrangement.\n\nMargin note: Keep W.P. away from open flame in the Ledger room."},
  n_yearbook:{title:"Yearbook, 1987",text:"Back row, third from left: a kid with your face and your teal hoodie.\n\nCaption: ROBIN HALE - \"Never absent.\"\n\nYou turn the page. Same kid, same smile, in the class of '91. And '94. And '98."},
  n_letter:{title:"Letter from Principal Crane",text:"To the Board of Trustees: Enrollment holding at 214. Absences: 0. The ledger is secure.\n\nMr. Pell has been 'suggesting' that burning it would close the books and free the counted. I cannot confirm this. I would rather not find out.\n\nBurn nothing. Ring nothing. Keep the numbers. -A.C."},
  n_tally:{title:"Tally Marks",text:"Tens of thousands of tally marks climb the stairwell wall. Beside the last group, scratched with something that was not a pen:\n\nTHEY ALL TAKE THE STAIRS AT 4:47."},
  n_journal:{title:"Pell's Journal",text:"Oct 1989. I tried the doors. I tried the rope. The Bell rings itself and nothing stops roll except the ledger. I think if the ledger burns, the books close. My lighter is in the footlocker. I can't bring myself to.\n\nTo reach the Bell room, bleed the boiler: BLUE, then RED, then YELLOW. I wrote it on my hand so I'd remember.\n\nIf you pull the rope yourself, roll ends for the night. But you answer it. I've heard what answers. I'm not brave. Are you?"},
  n_cards:{title:"Attendance Cards",text:"Drawers of index cards. Every card: a name, a year, and the same stamp: PRESENT.\n\nThere is no ABSENT stamp in the drawer. The slot where it should be has been sanded smooth."},
  n_photos:{title:"Class Photos 1984-1998",text:"In every photo, at the very back, an extra kid stands slightly out of focus. In the 1998 photo the extra kid is turned away from the camera.\n\nThe frame for 1999 is on the wall already. Empty. A nail waiting."},
  n_lost:{title:"Lost & Found",text:"Hundreds of single shoes, lunch boxes, a violin case, a teal hoodie. Every item is tagged with a name and a date.\n\nNot one has ever been claimed."}
};
const NOTE_TOTAL=Object.keys(NOTES).length;

/* ================= STATE HELPERS ================= */
function toast(s){const e=$('toast');e.textContent=s;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.style.opacity=0;},2600);}
function gain(id,quiet){if(G.items.indexOf(id)<0){G.items.push(id);sfx.pick();if(!quiet)toast("Obtained: "+ITEMS[id].name);}}
function has(id){return G.items.indexOf(id)>=0;}
function note(id,quiet){if(G.notes.indexOf(id)<0){G.notes.push(id);if(!quiet)toast("Note added: "+NOTES[id].title);}}
function readNote(id,pre){note(id);say((pre||[]).concat([NOTES[id].text]));}
function objective(){
  const f=G.flags;
  if(!f.notebook)return f.clockSeen?"Open locker 113 (the one with the blue sticker) in the hallway. The code is the time the clock stopped.":"Get your notebook. Your locker is in the hallway (blue sticker). Check Room 2B for the combination.";
  if(!f.tapePlayed)return "Find a way out. 'The tape is the key.' Try the Music Room.";
  if(!f.rustyKey)return "Something clicked inside the Music Room. Search it.";
  if(!f.safeOpen)return "The Principal's Office. Look for a safe. 'The year the Program began.'";
  if(!f.basementUnlocked)return "Take the iron key to the BASEMENT door at the east end of the hall.";
  if(!f.gate)return "The iron gate in the basement is held shut by steam pressure. Find a way to bleed the boiler.";
  return "Reach the bell chamber. Decide what happens to the ledger.";
}
function after(t,fn){G.timers.push({t:t,fn:fn});}
function shake(s){G.shake=s;}

/* ================= DIALOGUE ================= */
const dlgEl=$('dlg'),whoEl=$('who'),txtEl=$('txt');
function say(lines,cb,opts){
  if(!Array.isArray(lines))lines=[lines];
  opts=opts||{};
  dlg={lines:lines.slice(),i:0,pos:0,tick:0,full:'',cb:cb,after:opts.after||'play',plain:opts.plain,onLine:opts.onLine};
  mode='dlg';showLine();
}
function showLine(){
  let s=dlg.lines[dlg.i],who='';
  if(s.charAt(0)==='@'){const k=s.indexOf('|');who=s.slice(1,k);s=s.slice(k+1);}
  dlg.full=s;dlg.pos=0;dlg.tick=0;
  whoEl.textContent=who;whoEl.style.display=who?'block':'none';
  txtEl.textContent='';
  dlgEl.classList.remove('hidden');
  dlgEl.classList.toggle('plain',!!dlg.plain);
  if(dlg.onLine)dlg.onLine(dlg.i,s);
}
function advance(){
  if(!dlg)return;
  if(dlg.pos<dlg.full.length){dlg.pos=dlg.full.length;txtEl.textContent=dlg.full;return;}
  dlg.i++;
  if(dlg.i<dlg.lines.length){showLine();sfx.blip();return;}
  dlgEl.classList.add('hidden');
  const cb=dlg.cb,af=dlg.after;dlg=null;mode=af;
  if(cb)cb();
}

/* ================= MENU / CODE / CHOICE ================= */
let menuTab=0,menuIdx=0;
function openMenu(){mode='menu';menuIdx=0;$('menu').classList.remove('hidden');renderMenu();sfx.blip();}
function closeMenu(){$('menu').classList.add('hidden');mode='play';}
function renderMenu(){
  const list=menuTab===0?G.items.map(i=>ITEMS[i]):G.notes.map(n=>({name:NOTES[n].title,desc:NOTES[n].text}));
  $('tabItems').className=menuTab===0?'on':'';$('tabNotes').className=menuTab===1?'on':'';
  $('tabItems').textContent="ITEMS ("+G.items.length+")";$('tabNotes').textContent="NOTES ("+G.notes.length+"/"+NOTE_TOTAL+")";
  menuIdx=clamp(menuIdx,0,Math.max(0,list.length-1));
  const L=$('menuList');L.innerHTML='';
  const start=Math.max(0,menuIdx-8);
  list.slice(start,start+10).forEach((e,i)=>{const d=document.createElement('div');d.textContent=e.name;if(start+i===menuIdx)d.className='sel';L.appendChild(d);});
  if(!list.length){L.innerHTML='<div>(nothing yet)</div>';}
  $('menuDesc').textContent=list.length?list[menuIdx].desc:'';
  $('menuFoot').textContent="OBJECTIVE: "+objective()+"\n[LEFT/RIGHT] tab   [UP/DOWN] select   [ESC] close";
}
function menuKey(k){
  if(k==='escape'||k==='i'||k==='tab'){closeMenu();return;}
  if(k==='arrowleft'||k==='a'||k==='arrowright'||k==='d'){menuTab=1-menuTab;menuIdx=0;sfx.blip();renderMenu();}
  else if(k==='arrowup'||k==='w'){menuIdx--;sfx.blip();renderMenu();}
  else if(k==='arrowdown'||k==='s'){menuIdx++;sfx.blip();renderMenu();}
}
let codeSt=null;
function openCode(title,ans,ok,hint){
  codeSt={ans:ans,val:'',ok:ok};
  $('codeTitle').textContent=title;$('codeHint').textContent=hint||'[0-9] type  [ENTER] try  [ESC] cancel';
  renderCode();$('code').classList.remove('hidden');mode='code';
}
function renderCode(){
  const b=$('codeBoxes');b.innerHTML='';
  for(let i=0;i<codeSt.ans.length;i++){const d=document.createElement('div');d.className='cb';d.textContent=codeSt.val.charAt(i)||'_';b.appendChild(d);}
}
function codeKey(k){
  if(k.length===1&&k>='0'&&k<='9'){if(codeSt.val.length<codeSt.ans.length){codeSt.val+=k;sfx.blip();renderCode();}}
  else if(k==='backspace'){codeSt.val=codeSt.val.slice(0,-1);renderCode();}
  else if(k==='escape'){$('code').classList.add('hidden');mode='play';}
  else if(k==='enter'){
    if(codeSt.val===codeSt.ans){$('code').classList.add('hidden');mode='play';sfx.unlock();const ok=codeSt.ok;codeSt=null;ok();}
    else{sfx.click();codeSt.val='';renderCode();$('codeHint').textContent='Click. Nothing happens.';}
  }
}
let chSt=null;
function openChoice(title,opts){
  chSt={opts:opts,i:0};$('choiceTitle').textContent=title;renderChoice();
  $('choice').classList.remove('hidden');mode='choice';
}
function renderChoice(){
  const L=$('choiceList');L.innerHTML='';
  chSt.opts.forEach((o,i)=>{const d=document.createElement('div');d.textContent=(i===chSt.i?'> ':'  ')+o.label;d.className=(i===chSt.i?'sel ':'')+(o.on===false?'off':'');L.appendChild(d);});
}
function choiceKey(k){
  if(k==='arrowup'||k==='w'){chSt.i=(chSt.i+chSt.opts.length-1)%chSt.opts.length;sfx.blip();renderChoice();}
  else if(k==='arrowdown'||k==='s'){chSt.i=(chSt.i+1)%chSt.opts.length;sfx.blip();renderChoice();}
  else if(k==='enter'||k==='e'||k===' '){
    const o=chSt.opts[chSt.i];
    if(o.on===false){sfx.click();return;}
    $('choice').classList.add('hidden');mode='play';chSt=null;o.pick();
  }
}

function mk(id,w,h,theme,p){
  const r=Object.assign({id:id,w:w,h:h,top:2,theme:TH[theme],objs:[],lights:[],pw:w*T,ph:h*T,dark:function(){return .6;},amb:[.05,150],cp:[48,100]},p||{});

const vis=o=>!o.vis||o.vis();

function go(rid,x,y,dir,sound){
  if(mode==='trans')return;
  mode='trans';(sound||sfx.door)();
  fadeTo(1,function(){
    G.room=rid;const p=G.player;p.x=x;p.y=y;if(dir)p.dir=dir;p.cp=[x,y];p.moving=false;
    G.mon=null;G.timers=G.timers.filter(t=>t.keep);
    setupRoom();
    fadeTo(0,function(){mode='play';enterEvents(rid);},290);
  });
}
function setupRoom(){
  const r=rooms[G.room];setAmb(r.amb[0],r.amb[1]);
  G.monTimer=monAllowed(r)?5:-1;

function monSpawn(){
  const r=rooms[G.room];if(!r.monSpawn||!monAllowed(r))return;
  let best=null,bd=-1;
  r.monSpawn.forEach(s=>{const d=Math.hypot(s[0]-G.player.x,s[1]-G.player.y);if(d>bd){bd=d;best=s;}});
  if(bd<130){G.monTimer=1;return;}
  G.mon={x:best[0],y:best[1],frozen:false};
  sfx.stinger();
  if(!G.flags.monSeen){G.flags.monSeen=1;
    const l=["Something is standing at the end of the hall. Tall. Perfectly still. A faded hall-monitor sash across its chest. Where its face should be: nothing - only pale, smooth, listening.","You blink. It's closer."];

const MOVE={w:'up',arrowup:'up',s:'down',arrowdown:'down',a:'left',arrowleft:'left',d:'right',arrowright:'right'};

function onKey(k){
  if(mode==='title'){startIntro();return;}
  if(mode==='dlg'){if(isAct(k))advance();return;}
  if(mode==='menu'){menuKey(k);return;}

    if(isAct(k)){const t=findTarget();if(t){sfx.blip();t.use(t);}}

}

/* ================= UPDATE ================= */
function solidTile(r,tx,ty){
  if(tx<0||ty<0||tx>=r.w||ty>=r.h)return true;
  return tx===0||tx===r.w-1||ty<r.top||ty===r.h-1;
}
function blocked(r,x,y){
  const bx=x-4,by=y-5,bw=8,bh=5;
  const x0=Math.floor(bx/T),x1=Math.floor((bx+bw-1)/T),y0=Math.floor(by/T),y1=Math.floor((by+bh-1)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solidTile(r,tx,ty))return true;
  for(const o of r.objs){
    if(!isSolid(o)||!vis(o))continue;
    if(bx<o.x+o.w&&bx+bw>o.x&&by<o.y+o.h&&by+bh>o.y)return true;
  }
  return false;
}
function findTarget(){
  const r=rooms[G.room],p=G.player,d=DIR[p.dir];
  const fx=p.x+d[0]*7,fy=p.y-3+d[1]*8;
  let best=null,bd=1e9;
  for(const o of r.objs){
    if(!o.use||!vis(o))continue;
    const m=o.reach;
    if(fx>=o.x-m&&fx<=o.x+o.w+m&&fy>=o.y-m&&fy<=o.y+o.h+m){
      const dd=Math.pow(o.x+o.w/2-p.x,2)+Math.pow(o.y+o.h/2-p.y,2);
      if(dd<bd){bd=dd;best=o;}
    }
  }
  return best;
}
let lastHint='';
function setHint(s){if(s===lastHint)return;lastHint=s;const h=$('hint');if(s){h.textContent=s;h.style.display='block';}else h.style.display='none';}

const AMB_EV=[function(){sfx.slam();shake(.25);},function(){sfx.steps(8);},sfx.whisper,function(){if(A){const t=now();[[1,.12],[2.4,.06]].forEach(p=>osc('sine',174.6*p[0],t,3,p[1]*.4));}},sfx.creak,function(){sfx.locker();}];
function update(dt){
  G.clock+=dt;
  if(G.shake>0)G.shake-=dt;
  if(mode==='dlg'&&dlg){
    if(dlg.pos<dlg.full.length){
      dlg.pos=Math.min(dlg.full.length,dlg.pos+dt*58);
      const n=Math.floor(dlg.pos);txtEl.textContent=dlg.full.slice(0,n);
      if(n-dlg.tick>=3){dlg.tick=n;sfx.blip();}
    }
    $('more').style.visibility=dlg.pos>=dlg.full.length?'visible':'hidden';
  }
  if(mode!=='play')return;
  G.t+=dt;
  const r=rooms[G.room],p=G.player;
  for(let i=G.timers.length-1;i>=0;i--){
    const tm=G.timers[i];tm.t-=dt;
    if(tm.t<=0){G.timers.splice(i,1);tm.fn();if(mode!=='play')return;}
  }
  let ix=0,iy=0;
  for(const k in down){if(down[k]&&MOVE[k]){const d=DIR[MOVE[k]];ix+=d[0];iy+=d[1];}}
  ix=clamp(ix,-1,1);iy=clamp(iy,-1,1);
  p.moving=!!(ix||iy);
  if(p.moving){
    if(ix)p.dir=ix<0?'left':'right';else p.dir=iy<0?'up':'down';
    const sp=(ix&&iy?.707:1)*70*dt;
    const nx=p.x+ix*sp;if(!blocked(r,nx,p.y))p.x=nx;
    const ny=p.y+iy*sp;if(!blocked(r,p.x,ny))p.y=ny;
    p.anim+=dt*8;p.stepT-=dt;
    if(p.stepT<=0){sfx.step();p.stepT=.34;}
  }
  const tgt=findTarget();
  setHint(tgt?"[E] "+(tgt.label||'Examine'):'');
  if(G.room==='basement'&&p.x>556&&!G.flags.chamber){G.flags.chamber=1;G.mon=null;say(["The bell chamber. The air is still. Candles burn without flickering.","Whatever hunts the halls does not follow you here."]);}
  if(G.monTimer>0){G.monTimer-=dt;if(G.monTimer<=0)monSpawn();}
  if(G.mon){
    const m=G.mon;
    const dx=p.x-m.x,dy=p.y-m.y,dist=Math.hypot(dx,dy)||1;
    const d=DIR[p.dir];
    m.frozen=G.fl&&dist<125&&((m.x-p.x)/dist*d[0]+(m.y-p.y)/dist*d[1])>.4;
    if(!m.frozen){const sp=(G.fl?36:48)*dt;m.x+=dx/dist*sp;m.y+=dy/dist*sp;}
    if(dist<10){caught();return;}
    if(dist<95){G.beatT-=dt;if(G.beatT<=0){sfx.heart();G.beatT=.35+dist/160;}}
    if(G.flags.chamber&&G.room==='basement'&&p.x>556)G.mon=null;
  }
  G.ambT-=dt;
  if(G.ambT<=0){G.ambT=20+Math.random()*28;if(G.flags.notebook||Math.random()<.5)rnd(AMB_EV)();}
}

/* ================= RENDER ================= */
let camX=0,camY=0;
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x-camX),Math.round(y-camY),w,h);}
function flk(a){return .78+.22*Math.sin(G.clock*17+a*3)*Math.sin(G.clock*5.3+a)+(Math.random()<.04?-.35:0);}
function hash(a,b){return ((a*73856093)^(b*19349663))>>>0;}

function drawBase(r){
  const th=r.theme;
  const x0=Math.max(0,Math.floor(camX/T)),x1=Math.min(r.w-1,Math.floor((camX+VW)/T));
  const y0=Math.max(0,Math.floor(camY/T)),y1=Math.min(r.h-1,Math.floor((camY+VH)/T));
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const px=tx*T,py=ty*T;
    if(ty<r.top){
      if(ty===0){R(px,py,T,T,th.wa);R(px,py+T-1,T,1,th.trim);}
      else{R(px,py,T,T,th.wb);R(px,py,T,2,th.trim);R(px,py+T-2,T,2,th.trim);}
      if(th.brick){for(let b=0;b<2;b++){R(px,py+b*8+7,T,1,th.trim);R(px+((ty+b)%2?8:0),py+b*8,1,7,th.trim);}}
    }else if(tx===0||tx===r.w-1||ty===r.h-1){
      R(px,py,T,T,th.side);R(px,py,T,1,'#00000055');
      if(th.brick){R(px,py+7,T,1,'#0006');R(px+((ty%2)?8:0),py,1,7,'#0006');}
    }else{
      const h=hash(tx,ty);
      R(px,py,T,T,((tx+ty)&1)?th.fa:th.fb);
      if(th.planks){R(px,py,1,T,th.trim);R(px+8,py,1,T,'#0003');}
      else{R(px,py,T,1,'#0002');R(px,py,1,T,'#0002');}
      if(h%7===0)R(px+(h>>3)%12,py+(h>>5)%12,2,1,'#0003');
    }
  }
}

function drawPlayer(p){
  const bx=Math.round(p.x-6-camX),by=Math.round(p.y-15-camY);
  const f=p.moving?(Math.floor(p.anim)%2):0;
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(bx+1,by+14,10,2);
  ctx.fillStyle='#2b3550';ctx.fillRect(bx+3,by+10,3,4-(f?1:0));ctx.fillRect(bx+7,by+10,3,4-(f?0:1));
  ctx.fillStyle='#e8e8e8';ctx.fillRect(bx+3,by+14-(f?1:0),3,1);ctx.fillRect(bx+7,by+14-(f?0:1),3,1);
  ctx.fillStyle='#2f8f8a';ctx.fillRect(bx+2,by+5,9,6);ctx.fillRect(bx+1,by+6,2,4);ctx.fillRect(bx+10,by+6,2,4);
  ctx.fillStyle='#1f6a66';ctx.fillRect(bx+2,by+10,9,1);
  ctx.fillStyle='#e0b48c';ctx.fillRect(bx+3,by,7,6);ctx.fillRect(bx+1,by+9,2,1);ctx.fillRect(bx+10,by+9,2,1);
  ctx.fillStyle='#3a2a1c';
  if(p.dir==='up'){ctx.fillRect(bx+3,by,7,6);ctx.fillStyle='#8a3a2a';ctx.fillRect(bx+3,by+5,7,6);}
  else{ctx.fillRect(bx+3,by,7,2);ctx.fillRect(bx+3,by,1,4);ctx.fillRect(bx+9,by,1,4);
    ctx.fillStyle='#111';
    if(p.dir==='down'){ctx.fillRect(bx+4,by+3,1,2);ctx.fillRect(bx+8,by+3,1,2);ctx.fillStyle='#8a3a2a';ctx.fillRect(bx+3,by+6,1,4);ctx.fillRect(bx+9,by+6,1,4);}

    else{ctx.fillRect(bx+8,by+3,1,2);ctx.fillStyle='#8a3a2a';ctx.fillRect(bx+1,by+5,4,6);}}
}

function hole(x,y,r,a){
  const g=lx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'rgba(0,0,0,'+a+')');g.addColorStop(.55,'rgba(0,0,0,'+(a*.55)+')');g.addColorStop(1,'rgba(0,0,0,0)');
  lx.fillStyle=g;lx.beginPath();lx.arc(x,y,r,0,6.2832);lx.fill();
}
function renderLight(r,threat){
  lx.globalCompositeOperation='source-over';lx.clearRect(0,0,VW,VH);
  lx.fillStyle='rgba(3,2,7,'+Math.min(.97,r.dark()+threat*.05)+')';lx.fillRect(0,0,VW,VH);
  lx.globalCompositeOperation='destination-out';
  r.lights.forEach((L,i)=>{if(L.show&&!L.show())return;let a=L.a;if(L.flick)a*=Math.max(.15,flk(i));hole(L.x-camX,L.y-camY,L.r,a);});
  const p=G.player,px=p.x-camX,py=p.y-6-camY;
  hole(px,py,26,.62);
  if(G.fl&&mode!=='title'){
    const d=DIR[p.dir];const fl=(G.mon&&threat>.35&&Math.random()<.25)?.4:1;
    [[22,30,.95],[44,38,.9],[68,44,.8],[92,40,.55]].forEach(c=>hole(px+d[0]*c[0],py+d[1]*c[0]+(d[1]===0?2:0),c[1],c[2]*fl));
  }
}

  camX=Math.round(camX);camY=Math.round(camY);
  if(G.shake>0){camX+=Math.round((Math.random()-.5)*4);camY+=Math.round((Math.random()-.5)*4);}
  ctx.fillStyle='#000';ctx.fillRect(0,0,VW,VH);
  drawBase(r);
  const list=[];
  r.objs.forEach(o=>{if(vis(o))list.push({y:o.z!==undefined?o.z:o.y+o.h,f:()=>drawObj(o)});});
  if(mode!=='title')list.push({y:p.y,f:()=>drawPlayer(p)});
  if(G.mon)list.push({y:G.mon.y,f:()=>drawMon(G.mon)});
  list.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  let threat=0;
  if(G.mon){threat=clamp(1-Math.hypot(G.mon.x-p.x,G.mon.y-p.y)/150,0,1);}
  renderLight(r,threat);
  ctx.drawImage(lc,0,0);
  ctx.globalCompositeOperation='lighter';
  r.lights.forEach((L,i)=>{if(!L.col)return;if(L.show&&!L.show())return;const k=L.flick?Math.max(.2,flk(i)):1;
    const x=L.x-camX,y=L.y-camY;const g=ctx.createRadialGradient(x,y,0,x,y,L.r);
    g.addColorStop(0,'rgba('+L.col+','+(L.g*k)+')');g.addColorStop(1,'rgba('+L.col+',0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,L.r,0,6.2832);ctx.fill();});
  ctx.globalCompositeOperation='source-over';
  if(r.tint){ctx.fillStyle=r.tint;ctx.fillRect(0,0,VW,VH);}
  const vg=ctx.createRadialGradient(VW/2,VH/2,50,VW/2,VH/2,210);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,'+(.55+threat*.35)+')');
  ctx.fillStyle=vg;ctx.fillRect(0,0,VW,VH);
  if(threat>.4){ctx.fillStyle='rgba(120,0,0,'+(threat*.12)+')';ctx.fillRect(0,0,VW,VH);}
  ctx.fillStyle='rgba(255,255,255,.06)';
  for(let i=0;i<24;i++)ctx.fillRect((Math.random()*VW)|0,(Math.random()*VH)|0,1,1);
}

/* ================= LOOP ================= */
let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  try{update(dt);render();}catch(e){console.error(e);}
  requestAnimationFrame(loop);
}
G.room='hall';G.player.x=210;G.player.y=76;G.player.dir='right';
$('fade').style.opacity=0;
requestAnimationFrame(loop);
window.__game={G:G,rooms:rooms,go:go,say:say,onKey:onKey,advance:advance,update:update,render:render,caught:caught,setMode:function(m){mode=m;},getMode:function(){return mode;},startIntro:startIntro,ledgerScene:ledgerScene,ending:ending,SOL:SOL};
})();
</script>
